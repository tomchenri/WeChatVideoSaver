name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Download Vosk Chinese model (offline ASR, bundled into APK)
      run: |
        mkdir -p app/src/main/assets
        for i in 1 2 3; do
          curl -fsSL -o app/src/main/assets/vosk-model-small-cn-0.22.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip && break
          echo "retry $i"; sleep 3
        done
        ls -lh app/src/main/assets/
        SIZE=$(stat -c%s app/src/main/assets/vosk-model-small-cn-0.22.zip 2>/dev/null || echo 0)
        if [ "$SIZE" -lt 1000000 ]; then
          echo "模型下载过小，构建中止"; exit 1
        fi

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: Push build log on failure
      if: failure()
      run: |
        { grep -A 60 "What went wrong" build.log; echo "=== HEAD ==="; head -50 build.log; } > build-key.txt || cp build.log build-key.txt
        LOG_B64=$(base64 -w0 build-key.txt)
        API="https://api.github.com/repos/${{ github.repository }}"
        SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API/contents/build-key.txt" | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
        if [ -n "$SHA" ]; then
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
            "$API/contents/build-key.txt" \
            -d "{\"message\":\"build log run ${{ github.run_number }}\",\"content\":\"$LOG_B64\",\"sha\":\"$SHA\"}" || true
        else
          curl -s -X PUT -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" \
            "$API/contents/build-key.txt" \
            -d "{\"message\":\"build log run ${{ github.run_number }}\",\"content\":\"$LOG_B64\",\"branch\":\"main\"}" || true
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: WeChatVideoSaver-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: WeChatVideoSaver v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
