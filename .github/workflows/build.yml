name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        set -o pipefail
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}

    - name: Push build log on failure
      if: failure()
      run: |
        { grep -A 60 "What went wrong" build.log; echo "=== HEAD ==="; head -50 build.log; } > build-key.txt || cp build.log build-key.txt
        LOG_B64=$(base64 -w0 build-key.txt)
        curl -s -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          "https://api.github.com/repos/${{ github.repository }}/contents/build-key.txt" \
          -d "{\"message\":\"build log from run ${{ github.run_number }}\",\"content\":\"$LOG_B64\",\"branch\":\"main\"}" || true

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: WeChatVideoSaver-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: WeChatVideoSaver v1.0.${{ github.run_number }}
        files: app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
